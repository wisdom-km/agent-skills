# scripts/check settings. One KEY=value per line. Lines starting with # are ignored.
# This file is read as plain text (never executed). Keep values on one line.
# Item IDs (M-xx, R-x) come from project-essentials MANDATORY.md.

# Tier: demo | tracer | long. Unknown or empty = tracer (and the report says so).
TIER=demo

# [D] the project stores real user data: yes | no
REAL_DATA=no
# [P] other people can reach it (deployed, shared, installed by others): yes | no
PUBLIC=no

# M-02: the one command that starts the app. README.md must show it.
RUN_CMD=npm start

# M-06: one command that runs the tests. Required from tracer up (demo: recommended).
# Any tier: if TEST_CMD is set and the tests fail, scripts/check fails.
TEST_CMD=npm test

# M-09: install from the lockfile. Run only in CI mode (scripts/check --ci).
# Examples: npm ci | pnpm install --frozen-lockfile | yarn install --immutable
#           uv sync --locked | poetry install | pip install -r requirements.txt
INSTALL_CMD=npm ci

# Space-separated folders that each have their own dependency manifest. Default: .
APP_DIRS=.

# Optional: lint command (for example the dependency-direction or no-empty-catch rules).
LINT_CMD=

# M-04: command that checks logging rules (see recipes/logging.md). Required for long.
LOG_CHECK_CMD=

# M-04: space-separated core folders where bare print / console.log is forbidden. Empty = skip.
CORE_DIRS=
